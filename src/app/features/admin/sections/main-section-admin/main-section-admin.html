<section class="admin-hero">
  <div class="admin-hero__toolbar">
    <input type="text" value="Buscar pedido o producto" aria-label="Buscar" />
    <button type="button">Ver pendientes</button>
  </div>

  <div class="admin-stats">
    <article class="admin-stat" *ngFor="let stat of stats">
      <p>{{ stat.label }}</p>
      <h3>{{ stat.value }}</h3>
      <span>{{ stat.trend }}</span>
    </article>
  </div>
</section>
