<div class="admin-landing">
  <div class="admin-landing__pattern admin-landing__pattern--left" aria-hidden="true"></div>
  <div class="admin-landing__pattern admin-landing__pattern--right" aria-hidden="true"></div>

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="brand-block">
        <div class="brand-mark">GM</div>
        <div>
          <p class="eyebrow">Granito Mostaza</p>
          <h1>Panel administrador</h1>
        </div>
      </div>

      <nav class="admin-nav" aria-label="Administracion">
        <ng-container *ngFor="let item of navItems">
          <a
            *ngIf="item.route; else disabledItem"
            class="admin-nav__item"
            [routerLink]="item.route"
            routerLinkActive="admin-nav__item--active"
            [routerLinkActiveOptions]="{ exact: item.route === '/admin' }"
          >
            <i [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>

          <ng-template #disabledItem>
            <span class="admin-nav__item admin-nav__item--disabled">
              <i [class]="item.icon"></i>
              <span>{{ item.label }}</span>
            </span>
          </ng-template>
        </ng-container>
      </nav>

      <div class="admin-sidebar__card">
        <p class="admin-sidebar__label">Panel activo</p>
        <h2>Pedidos, productos y reportes</h2>
        <p>
          Este dashboard ahora funciona como portada del admin: entra a pedidos, ajusta el catalogo y revisa reportes sin perder el contexto.
        </p>
        <a routerLink="/" class="admin-sidebar__link">Volver a la vista cliente</a>
      </div>
    </aside>

    <main class="admin-content">
      <app-main-section-admin></app-main-section-admin>
      <app-secondary-section-admin></app-secondary-section-admin>
      <app-third-section-admin></app-third-section-admin>
      <app-fourth-section-admin></app-fourth-section-admin>
    </main>
  </div>

  <app-floating-home-button></app-floating-home-button>
</div>
